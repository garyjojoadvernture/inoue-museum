<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page-title">作品详情 - Inoue Museum</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <style>
        .detail {
            max-width: 600px;
            margin: 0 auto;
            padding: var(--spacing-xl) 24px;
        }

        .detail-back {
            display: inline-block;
            font-size: 13px;
            color: var(--color-text-light);
            letter-spacing: 1px;
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
        }

        .detail-back:hover {
            color: var(--color-text);
            border-bottom-color: var(--color-text);
            opacity: 1;
        }

        .detail-year {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--color-text-light);
            letter-spacing: 1px;
            margin-bottom: var(--spacing-xs);
        }

        .detail-title {
            font-family: var(--font-serif);
            font-size: 28px;
            letter-spacing: 3px;
            margin-bottom: 4px;
        }

        .detail-title-en {
            font-size: 14px;
            color: var(--color-text-secondary);
            letter-spacing: 1px;
            margin-bottom: var(--spacing-md);
        }

        .detail-tag {
            display: inline-block;
            font-size: 11px;
            color: var(--color-text-light);
            letter-spacing: 1px;
            padding: 2px 8px;
            border: 1px solid var(--color-border);
            margin-bottom: var(--spacing-lg);
        }

        .detail-image {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            margin-bottom: var(--spacing-lg);
        }

        .detail-image-placeholder {
            width: 100%;
            height: 200px;
            background: var(--color-bg-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: var(--spacing-lg);
        }

        .detail-image-placeholder span {
            font-family: var(--font-serif);
            font-size: 48px;
            color: var(--color-border);
        }

        .detail-body {
            font-size: 15px;
            line-height: 2;
            color: var(--color-text-secondary);
        }

        /* Related */
        .related {
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--color-border-light);
        }

        .related h3 {
            font-family: var(--font-sans);
            font-size: 13px;
            letter-spacing: 3px;
            color: var(--color-text-light);
            font-weight: 300;
            margin-bottom: var(--spacing-md);
        }

        .related-list {
            list-style: none;
        }

        .related-list li {
            border-bottom: 1px solid var(--color-border-light);
        }

        .related-list a {
            display: flex;
            align-items: baseline;
            gap: 16px;
            padding: 12px 0;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .related-list a:hover {
            opacity: 0.6;
        }

        .related-list .r-year {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-light);
            flex-shrink: 0;
            width: 40px;
        }

        .not-found {
            text-align: center;
            padding: var(--spacing-xxl) 24px;
            color: var(--color-text-light);
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .detail-title {
                font-size: 22px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="../index.html" class="nav-site" data-i18n="nav-site">井上博物館</a>
            <div class="nav-links">
                <a href="inouework.html" class="active" data-i18n="nav-works">作品</a>
                <a href="../goods/slamdunk/slamdunkgoods.html" data-i18n="nav-goods">收藏</a>
                <a href="../about.html" data-i18n="nav-about">关于</a>
                <a href="../guestbook.html" data-i18n="nav-guestbook">留言</a>
            </div>
            <div class="language-switcher">
                <div class="language-dropdown">
                    <button class="language-btn" onmouseover="showLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <span data-i18n="lang-label">语言</span><span class="arrow">&#9662;</span>
                    </button>
                    <div class="language-list" onmouseover="keepLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <button class="language-option selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
                        <button class="language-option" data-lang="en" onclick="switchLanguage('en')">English</button>
                        <button class="language-option" data-lang="ja" onclick="switchLanguage('ja')">日本語</button>
                    </div>
                </div>
            </div>
            <button class="nav-toggle" onclick="openMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-spacer"></div>

    <!-- Mobile Overlay -->
    <div class="nav-overlay" id="navOverlay">
        <button class="nav-close" onclick="closeMobileMenu()">&times;</button>
        <ul class="nav-overlay-links">
            <li><a href="inouework.html" data-i18n="nav-works">作品</a></li>
            <li><a href="../goods/slamdunk/slamdunkgoods.html" data-i18n="nav-goods">收藏</a></li>
            <li><a href="../about.html" data-i18n="nav-about">关于</a></li>
            <li><a href="../guestbook.html" data-i18n="nav-guestbook">留言</a></li>
        </ul>
        <div class="nav-overlay-lang">
            <button class="selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
            <button data-lang="en" onclick="switchLanguage('en')">EN</button>
            <button data-lang="ja" onclick="switchLanguage('ja')">JP</button>
        </div>
    </div>

    <!-- Detail Content -->
    <div class="detail" id="detailContent">
        <!-- Generated by JS -->
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p data-i18n="footer">&copy; 2024 Inoue Museum</p>
        </div>
    </footer>

    <script src="../js/navigation.js"></script>
    <script src="timeline-data.js"></script>
    <script>
        const translations = {
            zh: {
                'nav-site': '井上博物館',
                'nav-works': '作品',
                'nav-goods': '收藏',
                'nav-about': '关于',
                'nav-guestbook': '留言',
                'lang-label': '语言',
                'back': '← 返回年表',
                'related': '相关年份',
                'not-found': '未找到该年份的作品信息',
                'footer': '© 2024 Inoue Museum'
            },
            en: {
                'nav-site': 'Inoue Museum',
                'nav-works': 'Works',
                'nav-goods': 'Collection',
                'nav-about': 'About',
                'nav-guestbook': 'Guestbook',
                'lang-label': 'Lang',
                'back': '← Back to timeline',
                'related': 'Related years',
                'not-found': 'No entry found for this year',
                'footer': '© 2024 Inoue Museum'
            },
            ja: {
                'nav-site': '井上博物館',
                'nav-works': '作品',
                'nav-goods': 'コレクション',
                'nav-about': '紹介',
                'nav-guestbook': '掲示板',
                'lang-label': '言語',
                'back': '← 年表に戻る',
                'related': '関連する年',
                'not-found': 'この年の作品情報が見つかりません',
                'footer': '© 2024 井上博物館'
            }
        };

        function getLocalizedItem(item, lang) {
            return {
                year: item.year,
                title: lang === 'ja' ? (item.titleJa || item.title) : (lang === 'en' ? item.titleEn : item.title),
                titleEn: item.titleEn,
                description: lang === 'ja' ? (item.descriptionJa || item.description) : (lang === 'en' ? item.descriptionEn : item.description),
                tag: item.tag,
                image: item.image
            };
        }

        function render() {
            const container = document.getElementById('detailContent');
            const yearParam = new URLSearchParams(window.location.search).get('year');
            const item = timelineData.find(d => String(d.year) === String(yearParam));
            const t = translations[currentLang] || translations.zh;

            if (!item) {
                container.innerHTML = `
                    <a href="inouework.html" class="detail-back">${t.back}</a>
                    <p class="not-found">${t.not-found}</p>
                `;
                return;
            }

            const loc = getLocalizedItem(item, currentLang);

            // Pick up to 5 related items (adjacent years)
            const idx = timelineData.indexOf(item);
            const related = [];
            for (let i = Math.max(0, idx - 2); i <= Math.min(timelineData.length - 1, idx + 2); i++) {
                if (i !== idx) related.push(timelineData[i]);
            }

            const imageHtml = loc.image
                ? `<img src="${loc.image}" alt="${loc.title}" class="detail-image">`
                : `<div class="detail-image-placeholder"><span>&mdash;</span></div>`;

            container.innerHTML = `
                <a href="inouework.html" class="detail-back">${t.back}</a>
                <div class="detail-year">${loc.year}</div>
                <h1 class="detail-title">${loc.title}</h1>
                <div class="detail-title-en">${loc.titleEn}</div>
                ${loc.tag ? `<span class="detail-tag">${loc.tag}</span>` : ''}
                ${imageHtml}
                <div class="detail-body">
                    <p>${loc.description}</p>
                </div>
                <div class="related">
                    <h3>${t.related}</h3>
                    <ul class="related-list">
                        ${related.map(r => {
                            const rLoc = getLocalizedItem(r, currentLang);
                            return `<li><a href="work-detail.html?year=${r.year}"><span class="r-year">${rLoc.year}</span><span>${rLoc.title}</span></a></li>`;
                        }).join('')}
                    </ul>
                </div>
            `;
        }

        window.addEventListener('langchange', render);
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
