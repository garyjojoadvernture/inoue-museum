<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page-title">作品年表 - Inoue Museum</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/navigation.css">
    <style>
        /* Timeline */
        .timeline {
            position: relative;
            padding-left: 80px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 60px;
            top: 0;
            bottom: 0;
            width: 1px;
            background: var(--color-border);
        }

        .timeline-entry {
            position: relative;
            padding: 20px 0;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .timeline-entry:hover {
            opacity: 0.6;
        }

        .timeline-entry::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 28px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--color-text-light);
            transition: background 0.2s;
        }

        .timeline-entry:hover::before {
            background: var(--color-text);
        }

        .timeline-year {
            position: absolute;
            left: -80px;
            top: 22px;
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--color-text-secondary);
            letter-spacing: 0;
            width: 48px;
            text-align: right;
        }

        .timeline-title {
            font-family: var(--font-serif);
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .timeline-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.7;
        }

        .timeline-tag {
            display: inline-block;
            font-size: 11px;
            color: var(--color-text-light);
            letter-spacing: 1px;
            margin-top: 6px;
            padding: 1px 6px;
            border: 1px solid var(--color-border-light);
        }

        /* Filter */
        .timeline-filter {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--color-border-light);
        }

        .timeline-filter button {
            background: none;
            border: none;
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--color-text-light);
            cursor: pointer;
            padding: 4px 0;
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .timeline-filter button:hover,
        .timeline-filter button.active {
            color: var(--color-text);
            border-bottom-color: var(--color-text);
        }

        .timeline-entry.hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .timeline {
                padding-left: 56px;
            }

            .timeline::before {
                left: 40px;
            }

            .timeline-year {
                left: -56px;
                width: 32px;
                font-size: 11px;
            }

            .timeline-entry::before {
                left: -20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="../index.html" class="nav-site" data-i18n="nav-site">井上博物館</a>
            <div class="nav-links">
                <a href="inouework.html" class="active" data-i18n="nav-works">作品</a>
                <a href="../goods/slamdunk/slamdunkgoods.html" data-i18n="nav-goods">收藏</a>
                <a href="../about.html" data-i18n="nav-about">关于</a>
                <a href="../guestbook.html" data-i18n="nav-guestbook">留言</a>
            </div>
            <div class="language-switcher">
                <div class="language-dropdown">
                    <button class="language-btn" onmouseover="showLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <span data-i18n="lang-label">语言</span><span class="arrow">&#9662;</span>
                    </button>
                    <div class="language-list" onmouseover="keepLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <button class="language-option selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
                        <button class="language-option" data-lang="en" onclick="switchLanguage('en')">English</button>
                        <button class="language-option" data-lang="ja" onclick="switchLanguage('ja')">日本語</button>
                    </div>
                </div>
            </div>
            <button class="nav-toggle" onclick="openMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-spacer"></div>

    <!-- Mobile Overlay -->
    <div class="nav-overlay" id="navOverlay">
        <button class="nav-close" onclick="closeMobileMenu()">&times;</button>
        <ul class="nav-overlay-links">
            <li><a href="inouework.html" data-i18n="nav-works">作品</a></li>
            <li><a href="../goods/slamdunk/slamdunkgoods.html" data-i18n="nav-goods">收藏</a></li>
            <li><a href="../about.html" data-i18n="nav-about">关于</a></li>
            <li><a href="../guestbook.html" data-i18n="nav-guestbook">留言</a></li>
        </ul>
        <div class="nav-overlay-lang">
            <button class="selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
            <button data-lang="en" onclick="switchLanguage('en')">EN</button>
            <button data-lang="ja" onclick="switchLanguage('ja')">JP</button>
        </div>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 data-i18n="title">作品年表</h1>
            <p class="subtitle" data-i18n="subtitle">Takehiko Inoue Works Timeline</p>
        </div>
    </div>

    <!-- Timeline -->
    <main class="container section" style="padding-top: 0;">
        <div class="timeline-filter" id="timelineFilter">
            <!-- Generated by JS -->
        </div>
        <div class="timeline" id="timeline">
            <!-- Generated by JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p data-i18n="footer">&copy; 2024 Inoue Museum</p>
        </div>
    </footer>

    <script src="../js/navigation.js"></script>
    <script src="timeline-data.js"></script>
    <script>
        const translations = {
            zh: {
                'nav-site': '井上博物館',
                'nav-works': '作品',
                'nav-goods': '收藏',
                'nav-about': '关于',
                'nav-guestbook': '留言',
                'lang-label': '语言',
                'title': '作品年表',
                'subtitle': 'Takehiko Inue Works Timeline',
                'page-title': '作品年表 - Inoue Museum',
                'footer': '© 2024 Inoue Museum',
                'filter-all': '全部'
            },
            en: {
                'nav-site': 'Inoue Museum',
                'nav-works': 'Works',
                'nav-goods': 'Collection',
                'nav-about': 'About',
                'nav-guestbook': 'Guestbook',
                'lang-label': 'Lang',
                'title': 'Works Timeline',
                'subtitle': 'Takehiko Inue Works Timeline',
                'page-title': 'Works Timeline - Inoue Museum',
                'footer': '© 2024 Inoue Museum',
                'filter-all': 'All'
            },
            ja: {
                'nav-site': '井上博物館',
                'nav-works': '作品',
                'nav-goods': 'コレクション',
                'nav-about': '紹介',
                'nav-guestbook': '掲示板',
                'lang-label': '言語',
                'title': '作品年表',
                'subtitle': 'Takehiko Inue Works Timeline',
                'page-title': '作品年表 - Inoue Museum',
                'footer': '© 2024 井上博物館',
                'filter-all': '全て'
            }
        };

        function getLocalizedItem(item, lang) {
            return {
                year: item.year,
                title: lang === 'ja' ? (item.titleJa || item.title) : (lang === 'en' ? item.titleEn : item.title),
                description: lang === 'ja' ? (item.descriptionJa || item.description) : (lang === 'en' ? item.descriptionEn : item.description),
                tag: item.tag,
                image: item.image
            };
        }

        // Collect unique tags
        function getTags() {
            const tags = new Set();
            timelineData.forEach(item => { if (item.tag) tags.add(item.tag); });
            return Array.from(tags);
        }

        let activeFilter = null;

        function renderFilter() {
            const filter = document.getElementById('timelineFilter');
            const tags = getTags();
            const allLabel = translations[currentLang]?.['filter-all'] || '全部';

            let html = `<button class="active" onclick="filterTimeline(null)">${allLabel}</button>`;
            tags.forEach(tag => {
                html += `<button onclick="filterTimeline('${tag}')">${tag}</button>`;
            });
            filter.innerHTML = html;
        }

        function filterTimeline(tag) {
            activeFilter = tag;
            document.querySelectorAll('.timeline-filter button').forEach(btn => {
                const allLabel = translations[currentLang]?.['filter-all'] || '全部';
                const isActive = tag === null ? btn.textContent === allLabel : btn.textContent === tag;
                btn.classList.toggle('active', isActive);
            });

            document.querySelectorAll('.timeline-entry').forEach(entry => {
                if (!tag) {
                    entry.classList.remove('hidden');
                } else {
                    entry.classList.toggle('hidden', entry.dataset.tag !== tag);
                }
            });
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            let html = '';

            timelineData.forEach((item, index) => {
                const loc = getLocalizedItem(item, currentLang);
                html += `
                    <div class="timeline-entry" data-tag="${loc.tag}" onclick="location.href='work-detail.html?year=${item.year}'">
                        <span class="timeline-year">${loc.year}</span>
                        <div class="timeline-title">${loc.title}</div>
                        <div class="timeline-desc">${loc.description}</div>
                        ${loc.tag ? `<span class="timeline-tag">${loc.tag}</span>` : ''}
                    </div>
                `;
            });

            container.innerHTML = html;
            renderFilter();

            // Re-apply filter if active
            if (activeFilter) filterTimeline(activeFilter);
        }

        // Re-render on language change
        window.addEventListener('langchange', function() {
            renderTimeline();
        });

        document.addEventListener('DOMContentLoaded', renderTimeline);
    </script>
</body>
</html>
