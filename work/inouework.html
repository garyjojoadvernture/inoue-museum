<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>井上雄彦作品年表 - Inoue Museum</title>
    <link rel="stylesheet" href="css/navigation.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Hiragino Kaku Gothic Pro", "Yu Gothic", YuGothic, "Meiryo", sans-serif;
            background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            min-height: 100vh;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px 100px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 20px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .page-title {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 15px;
            color: #1a1a2e;
        }

        .page-subtitle {
            font-size: 16px;
            color: #666;
            letter-spacing: 2px;
        }

        /* Timeline Styles */
        .timeline {
            position: relative;
            padding: 20px 0;
        }

        /* Central line */
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ff6b35 0%, #f7931e 50%, #ff6b35 100%);
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            width: 50%;
            padding: 20px 50px;
            box-sizing: border-box;
        }

        /* Left and right alternating items */
        .timeline-item:nth-child(odd) {
            left: 0;
            text-align: right;
        }

        .timeline-item:nth-child(even) {
            left: 50%;
            text-align: left;
        }

        /* Timeline dot */
        .timeline-item::before {
            content: '';
            position: absolute;
            top: 30px;
            width: 20px;
            height: 20px;
            background: white;
            border: 4px solid #ff6b35;
            border-radius: 50%;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .timeline-item:nth-child(odd)::before {
            right: -10px;
        }

        .timeline-item:nth-child(even)::before {
            left: -10px;
        }

        .timeline-item:hover::before {
            background: #ff6b35;
            transform: scale(1.3);
        }

        /* Timeline content card */
        .timeline-content {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .timeline-content:hover {
            transform: scale(1.05);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        /* Connector arrow */
        .timeline-item:nth-child(odd) .timeline-content::after {
            content: '';
            position: absolute;
            top: 25px;
            right: -12px;
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 12px solid white;
        }

        .timeline-item:nth-child(even) .timeline-content::after {
            content: '';
            position: absolute;
            top: 25px;
            left: -12px;
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-right: 12px solid white;
        }

        .timeline-year {
            font-size: 28px;
            font-weight: 600;
            color: #ff6b35;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .timeline-title {
            font-size: 18px;
            font-weight: 500;
            color: #1a1a2e;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .timeline-thumbnail {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f0f0f0 0%, #e0e0e0 100%);
            transition: transform 0.3s ease;
        }

        .timeline-content:hover .timeline-thumbnail {
            transform: scale(1.02);
        }

        .timeline-description {
            font-size: 13px;
            line-height: 1.7;
            color: #666;
        }

        .timeline-tag {
            display: inline-block;
            padding: 4px 12px;
            background: #f0f0f0;
            border-radius: 15px;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }

            .timeline-item {
                width: 100%;
                padding: 20px 20px 20px 60px;
                text-align: left !important;
            }

            .timeline-item:nth-child(odd)::before,
            .timeline-item:nth-child(even)::before {
                left: 10px;
                right: auto;
            }

            .timeline-item:nth-child(odd) .timeline-content::after,
            .timeline-item:nth-child(even) .timeline-content::after {
                left: -12px;
                right: auto;
                border-left: none;
                border-right: 12px solid white;
            }

            .page-title {
                font-size: 28px;
            }

            .timeline-thumbnail {
                height: 120px;
            }
        }

        /* Animation */
        .timeline-item {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .timeline-item:nth-child(1) { animation-delay: 0.1s; }
        .timeline-item:nth-child(2) { animation-delay: 0.15s; }
        .timeline-item:nth-child(3) { animation-delay: 0.2s; }
        .timeline-item:nth-child(4) { animation-delay: 0.25s; }
        .timeline-item:nth-child(5) { animation-delay: 0.3s; }
        .timeline-item:nth-child(6) { animation-delay: 0.35s; }
        .timeline-item:nth-child(7) { animation-delay: 0.4s; }
        .timeline-item:nth-child(8) { animation-delay: 0.45s; }
        .timeline-item:nth-child(9) { animation-delay: 0.5s; }
        .timeline-item:nth-child(10) { animation-delay: 0.55s; }
        .timeline-item:nth-child(11) { animation-delay: 0.6s; }
        .timeline-item:nth-child(12) { animation-delay: 0.65s; }
        .timeline-item:nth-child(13) { animation-delay: 0.7s; }
        .timeline-item:nth-child(14) { animation-delay: 0.75s; }
        .timeline-item:nth-child(15) { animation-delay: 0.8s; }
        .timeline-item:nth-child(16) { animation-delay: 0.85s; }
        .timeline-item:nth-child(17) { animation-delay: 0.9s; }
        .timeline-item:nth-child(18) { animation-delay: 0.95s; }
        .timeline-item:nth-child(19) { animation-delay: 1s; }
        .timeline-item:nth-child(20) { animation-delay: 1.05s; }
        .timeline-item:nth-child(21) { animation-delay: 1.1s; }
        .timeline-item:nth-child(22) { animation-delay: 1.15s; }
        .timeline-item:nth-child(23) { animation-delay: 1.2s; }
        .timeline-item:nth-child(24) { animation-delay: 1.25s; }
        .timeline-item:nth-child(25) { animation-delay: 1.3s; }
        .timeline-item:nth-child(26) { animation-delay: 1.35s; }
        .timeline-item:nth-child(27) { animation-delay: 1.4s; }
        .timeline-item:nth-child(28) { animation-delay: 1.45s; }
        .timeline-item:nth-child(29) { animation-delay: 1.5s; }
        .timeline-item:nth-child(30) { animation-delay: 1.55s; }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <a href="index.html" data-i18n="home">首页</a>
        <a href="about.html" data-i18n="about">关于</a>
        <a href="guestbook.html" data-i18n="guestbook">留言</a>
        <div class="language-switcher">
            <div class="language-dropdown">
                <button class="language-btn" onmouseover="showLanguageMenu()" onmouseout="hideLanguageMenu()">
                    语言<span class="arrow">▼</span>
                </button>
                <div class="language-list" id="languageList" onmouseover="keepLanguageMenu()" onmouseout="hideLanguageMenu()">
                    <button class="language-option selected" data-lang="zh" onclick="switchLanguage('zh')">
                        中文
                    </button>
                    <button class="language-option" data-lang="en" onclick="switchLanguage('en')">
                        English
                    </button>
                    <button class="language-option" data-lang="ja" onclick="switchLanguage('ja')">
                        日本語
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="page-header">
            <h1 class="page-title" data-i18n="timeline-title">作品年表</h1>
            <p class="page-subtitle" data-i18n="timeline-subtitle">Takehiko Inoue Works Timeline · 井上雄彦作品年表</p>
        </div>

        <div class="timeline" id="timeline">
            <!-- Timeline items will be generated by JavaScript -->
        </div>
    </div>

    <script src="../js/navigation.js"></script>
    <script src="timeline-data.js"></script>
    <script>
        // Generate timeline HTML
        // 获取当前语言对应的数据
        function getLocalizedItem(item, lang) {
            return {
                year: item.year,
                title: lang === 'ja' ? (item.titleJa || item.title) : (lang === 'en' ? item.titleEn : item.title),
                description: lang === 'ja' ? (item.descriptionJa || item.description) : (lang === 'en' ? item.descriptionEn : item.description),
                tag: item.tag,
                image: item.image
            };
        }

        function generateTimeline() {
            const timeline = document.getElementById('timeline');
            let html = '';

            timelineData.forEach((item, index) => {
                const localized = getLocalizedItem(item, currentLang);
                const hasImage = localized.image !== null;
                const imageHtml = hasImage
                    ? `<img src="${localized.image}" alt="${localized.title}" class="timeline-thumbnail" loading="lazy">`
                    : `<div class="timeline-thumbnail" style="display:flex;justify-content:center;align-items:center;font-size:40px;">📖</div>`;

                html += `
                    <div class="timeline-item">
                        <div class="timeline-content" onclick="openDetail(${index})">
                            <div class="timeline-year">${localized.year}</div>
                            <div class="timeline-title">${localized.title}</div>
                            ${imageHtml}
                            <p class="timeline-description">${localized.description}</p>
                            <span class="timeline-tag">${localized.tag}</span>
                        </div>
                    </div>
                `;
            });

            timeline.innerHTML = html;
        }

        // Open detail page
        function openDetail(index) {
            const item = timelineData[index];
            // Navigate to detail page with year parameter
            window.location.href = `work-detail.html?year=${item.year}`;
        }

        // Multi-language translations
        const translations = {
            zh: {
                home: '首页',
                about: '关于',
                guestbook: '留言',
                'timeline-title': '作品年表',
                'timeline-subtitle': 'Takehiko Inoue Works Timeline · 井上雄彦作品年表'
            },
            en: {
                home: 'Home',
                about: 'About',
                guestbook: 'Guestbook',
                'timeline-title': 'Works Timeline',
                'timeline-subtitle': 'Takehiko Inoue Works Timeline'
            },
            ja: {
                home: 'ホーム',
                about: 'について',
                guestbook: '掲示板',
                'timeline-title': '作品年表',
                'timeline-subtitle': '井上雄彦作品年表'
            }
        };

        let currentLang = 'zh';

        function switchLanguage(lang) {
            currentLang = lang;

            document.querySelector('.language-switcher').classList.remove('active');

            document.querySelectorAll('.language-option').forEach(opt => {
                opt.classList.toggle('selected', opt.dataset.lang === lang);
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            document.documentElement.lang = lang === 'zh' ? 'zh-CN' : (lang === 'en' ? 'en' : 'ja');

            // 重新生成时间轴以应用新语言
            generateTimeline();
        }

        // Set initial language
        document.addEventListener('DOMContentLoaded', function() {
            generateTimeline();

            const urlParams = new URLSearchParams(window.location.search);
            const lang = urlParams.get('lang');
            if (lang && ['zh', 'en', 'ja'].includes(lang)) {
                switchLanguage(lang);
            }
        });
    </script>
</body>
</html>
