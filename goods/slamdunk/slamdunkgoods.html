<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page-title">收藏 - Inoue Museum</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/navigation.css">
    <style>
        .goods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: var(--spacing-md);
            max-width: 900px;
            margin: 0 auto;
        }

        .goods-item {
            background: var(--color-bg-alt);
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .goods-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .goods-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%);
            transition: filter 0.3s ease;
        }

        .goods-item:hover img {
            filter: grayscale(0%);
        }

        .goods-item-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: #fff;
            font-size: 16px;
            letter-spacing: 2px;
            font-family: var(--font-serif);
        }

        .goods-item-empty {
            background: var(--color-bg-alt);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .goods-item-empty span {
            font-size: 13px;
            color: var(--color-text-light);
            letter-spacing: 1px;
        }

        .back-link {
            display: inline-block;
            font-size: 13px;
            color: var(--color-text-light);
            letter-spacing: 1px;
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--color-text);
            border-bottom-color: var(--color-text);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .goods-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="../../../index.html" class="nav-site" data-i18n="nav-site">井上博物館</a>
            <div class="nav-links">
                <a href="../../../work/inouework.html" data-i18n="nav-works">作品</a>
                <a href="../../../goods/goods.html" class="active" data-i18n="nav-goods">收藏</a>
                <a href="../../../about.html" data-i18n="nav-about">关于</a>
                <a href="../../../guestbook.html" data-i18n="nav-guestbook">留言</a>
            </div>
            <div class="language-switcher">
                <div class="language-dropdown">
                    <button class="language-btn" onmouseover="showLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <span data-i18n="lang-label">语言</span><span class="arrow">&#9662;</span>
                    </button>
                    <div class="language-list" onmouseover="keepLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <button class="language-option selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
                        <button class="language-option" data-lang="en" onclick="switchLanguage('en')">English</button>
                        <button class="language-option" data-lang="ja" onclick="switchLanguage('ja')">日本語</button>
                    </div>
                </div>
            </div>
            <button class="nav-toggle" onclick="openMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-spacer"></div>

    <!-- Mobile Overlay -->
    <div class="nav-overlay" id="navOverlay">
        <button class="nav-close" onclick="closeMobileMenu()">&times;</button>
        <ul class="nav-overlay-links">
            <li><a href="../../../work/inouework.html" data-i18n="nav-works">作品</a></li>
            <li><a href="../../../goods/goods.html" data-i18n="nav-goods">收藏</a></li>
            <li><a href="../../../about.html" data-i18n="nav-about">关于</a></li>
            <li><a href="../../../guestbook.html" data-i18n="nav-guestbook">留言</a></li>
        </ul>
        <div class="nav-overlay-lang">
            <button class="selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
            <button data-lang="en" onclick="switchLanguage('en')">EN</button>
            <button data-lang="ja" onclick="switchLanguage('ja')">JP</button>
        </div>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 data-i18n="title">SLAM DUNK 收藏</h1>
            <p class="subtitle" data-i18n="subtitle">Merchandise & Card Collection</p>
        </div>
    </div>

    <!-- Main -->
    <main class="container-wide section" style="padding-top: 0;">
        <a href="../goods.html" class="back-link" data-i18n="back">&larr; 返回收藏分类</a>

        <div class="goods-grid" id="goodsGrid">
            <!-- 由 slamdunk-goods-config.js 动态渲染 -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p data-i18n="footer">&copy; 2024 Inoue Museum</p>
        </div>
    </footer>

    <script>
        // Dynamic config loading with cache-bust
        var configLoaded = false;
        (function() {
            var s = document.createElement('script');
            s.src = 'slamdunk-goods-config.js?v=' + Date.now();
            s.onload = function() {
                configLoaded = true;
                if (document.readyState !== 'loading') {
                    renderGrid();
                }
            };
            document.head.appendChild(s);
        })();
    </script>
    <script src="../../../js/navigation.js"></script>
    <script>
        function getLang() {
            var docLang = document.documentElement.lang;
            var map = { 'zh-CN': 'zh', 'en': 'en', 'ja': 'ja', 'zh': 'zh' };
            return map[docLang] || window.currentLang || localStorage.getItem('inoue-lang') || 'zh';
        }

        function renderGrid() {
            const grid = document.getElementById('goodsGrid');
            const lang = getLang();
            grid.innerHTML = '';

            slamdunkGoodsConfig.categories.forEach(function(cat) {
                const a = document.createElement('a');
                a.className = 'goods-item' + (cat.cover ? '' : ' goods-item-empty');
                a.href = cat.link || '#';

                if (cat.cover) {
                    const img = document.createElement('img');
                    img.src = cat.cover;
                    img.alt = cat.subtitle || '';
                    img.loading = 'lazy';
                    a.appendChild(img);

                    const label = document.createElement('div');
                    label.className = 'goods-item-label';
                    label.textContent = (cat.title && cat.title[lang]) || cat.subtitle || '';
                    a.appendChild(label);
                } else {
                    const span = document.createElement('span');
                    span.textContent = (cat.title && cat.title[lang]) || cat.subtitle || '';
                    a.appendChild(span);
                }

                grid.appendChild(a);
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (configLoaded) renderGrid();
        });
        window.addEventListener('langchange', renderGrid);
    </script>
    <script>
        const translations = {
            zh: {
                'nav-site': '井上博物館',
                'nav-works': '作品',
                'nav-goods': '收藏',
                'nav-about': '关于',
                'nav-guestbook': '留言',
                'lang-label': '语言',
                'title': 'SLAM DUNK 收藏',
                'subtitle': 'Merchandise & Card Collection',
                'back': '← 返回收藏分类',
                'footer': '© 2024 Inoue Museum'
            },
            en: {
                'nav-site': 'Inoue Museum',
                'nav-works': 'Works',
                'nav-goods': 'Collection',
                'nav-about': 'About',
                'nav-guestbook': 'Guestbook',
                'lang-label': 'Lang',
                'title': 'SLAM DUNK Collection',
                'subtitle': 'Merchandise & Card Collection',
                'back': '← Back to Collection',
                'footer': '© 2024 Inoue Museum'
            },
            ja: {
                'nav-site': '井上博物館',
                'nav-works': '作品',
                'nav-goods': 'コレクション',
                'nav-about': '紹介',
                'nav-guestbook': '掲示板',
                'lang-label': '言語',
                'title': 'SLAM DUNK コレクション',
                'subtitle': 'グッズとカードコレクション',
                'back': '← コレクションに戻る',
                'footer': '© 2024 井上博物館'
            }
        };
    </script>
</body>
</html>
