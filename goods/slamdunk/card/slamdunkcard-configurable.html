<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0;url=card-gallery.html">
    <title>Redirecting...</title>
    <script>
        // Pass through any series parameter
        const params = new URLSearchParams(window.location.search);
        const series = params.get('series');
        if (series) {
            document.querySelector('meta[http-equiv="refresh"]').content = `0;url=card-gallery.html?series=${series}`;
        }
    </script>
</head>
<body>
    <p>Redirecting to <a href="card-gallery.html">Card Gallery</a>...</p>
</body>
</html>
