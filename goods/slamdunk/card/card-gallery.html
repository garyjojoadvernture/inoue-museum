<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAMDUNK Card Gallery</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/navigation.css">
    <style>
        /* Series header */
        .series-header {
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 1px solid var(--color-border-light);
        }

        .series-header h2 {
            font-family: var(--font-serif);
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .series-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.8;
            max-width: 600px;
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: var(--spacing-lg);
            flex-wrap: wrap;
        }

        .filter-search {
            flex: 1;
            min-width: 200px;
            padding: 8px 0;
            border: none;
            border-bottom: 1px solid var(--color-border);
            font-size: 14px;
            font-family: var(--font-sans);
            background: transparent;
            color: var(--color-text);
            outline: none;
            transition: border-color 0.2s;
        }

        .filter-search:focus {
            border-bottom-color: var(--color-text);
        }

        .filter-search::placeholder {
            color: var(--color-text-light);
        }

        .filter-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tag {
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--color-text-light);
            background: none;
            border: 1px solid var(--color-border-light);
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .filter-tag:hover,
        .filter-tag.active {
            color: var(--color-text);
            border-color: var(--color-text);
        }

        /* Card grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        /* Card */
        .card {
            aspect-ratio: 2.5/3.5;
            perspective: 800px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            overflow: hidden;
            background: var(--color-bg-alt);
        }

        .card-face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-front {}

        .card-back {
            transform: rotateY(180deg);
        }

        .card-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px;
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-num {
            font-family: var(--font-mono);
            font-size: 11px;
            color: rgba(255,255,255,0.8);
        }

        .card-zoom {
            width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.8);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--color-text);
            transition: background 0.2s;
        }

        .card-zoom:hover {
            background: #fff;
        }

        .card-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-alt);
            color: var(--color-border);
            font-family: var(--font-mono);
            font-size: 14px;
        }

        .card.hidden {
            display: none;
        }

        /* Load more */
        .load-more {
            text-align: center;
            margin-top: var(--spacing-lg);
        }

        .load-more-btn {
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--color-text-secondary);
            background: none;
            border: 1px solid var(--color-border);
            padding: 10px 32px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .load-more-btn:hover {
            color: var(--color-text);
            border-color: var(--color-text);
        }

        .no-results {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--color-text-light);
            font-size: 14px;
            display: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.96);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            width: 400px;
            max-width: 90vw;
            max-height: 85vh;
            perspective: 1000px;
            cursor: pointer;
        }

        .modal-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
        }

        .modal-card.flipped .modal-card-inner {
            transform: rotateY(180deg);
        }

        .modal-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .modal-face img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .modal-back {
            transform: rotateY(180deg);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: none;
            border: none;
            font-size: 28px;
            color: var(--color-text-light);
            cursor: pointer;
            z-index: 10;
            transition: color 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--color-text);
        }

        .modal-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-light);
            letter-spacing: 1px;
        }

        /* Touch zoom */
        .modal-image-container {
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        .modal-image-wrapper {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        .modal-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .back-link {
            display: inline-block;
            font-size: 13px;
            color: var(--color-text-light);
            letter-spacing: 1px;
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--color-text);
            border-bottom-color: var(--color-text);
            opacity: 1;
        }

        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .modal-card {
                width: 90vw;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="../../../index.html" class="nav-site">井上博物館</a>
            <div class="nav-links">
                <a href="../../../work/inouework.html" data-i18n="nav-works">作品</a>
                <a href="../slamdunkgoods.html" class="active" data-i18n="nav-goods">收藏</a>
                <a href="../../../about.html" data-i18n="nav-about">关于</a>
                <a href="../../../guestbook.html" data-i18n="nav-guestbook">留言</a>
            </div>
            <div class="language-switcher">
                <div class="language-dropdown">
                    <button class="language-btn" onmouseover="showLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <span data-i18n="lang-label">语言</span><span class="arrow">&#9662;</span>
                    </button>
                    <div class="language-list" onmouseover="keepLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <button class="language-option selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
                        <button class="language-option" data-lang="en" onclick="switchLanguage('en')">English</button>
                        <button class="language-option" data-lang="ja" onclick="switchLanguage('ja')">日本語</button>
                    </div>
                </div>
            </div>
            <button class="nav-toggle" onclick="openMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-spacer"></div>

    <!-- Mobile Overlay -->
    <div class="nav-overlay" id="navOverlay">
        <button class="nav-close" onclick="closeMobileMenu()">&times;</button>
        <ul class="nav-overlay-links">
            <li><a href="../../../work/inouework.html" data-i18n="nav-works">作品</a></li>
            <li><a href="../slamdunkgoods.html" data-i18n="nav-goods">收藏</a></li>
            <li><a href="../../../about.html" data-i18n="nav-about">关于</a></li>
            <li><a href="../../../guestbook.html" data-i18n="nav-guestbook">留言</a></li>
        </ul>
        <div class="nav-overlay-lang">
            <button class="selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
            <button data-lang="en" onclick="switchLanguage('en')">EN</button>
            <button data-lang="ja" onclick="switchLanguage('ja')">JP</button>
        </div>
    </div>

    <!-- Main -->
    <main class="container-wide section">
        <a href="../slamdunkgoods.html" class="back-link" data-i18n="back">&larr; 返回收藏</a>

        <div class="series-header">
            <h2 id="seriesTitle">SLAMDUNK Cards</h2>
            <p class="series-desc" id="seriesDesc"></p>
        </div>

        <div class="filter-bar">
            <input type="text" class="filter-search" id="searchInput" placeholder="Search..." oninput="searchCards()">
            <div class="filter-tags" id="filterTags"></div>
        </div>

        <div class="card-grid" id="cardGrid"></div>
        <div class="no-results" id="noResults">No results</div>

        <div class="load-more">
            <button class="load-more-btn" id="loadMoreBtn" onclick="loadMoreCards()">Load more</button>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-card" id="modalCard"></div>
        <div class="modal-info" id="modalInfo"></div>
    </div>

    <script src="card-config.js"></script>
    <script src="../../../js/navigation.js"></script>
    <script>
        // --- Config ---
        const config = currentConfig;
        const cardNumbers = config.cardNumbers || Array.from({length: config.totalCards}, (_, i) => i + 1);
        const CARDS_PER_PAGE = config.cardsPerPage || 36;

        let currentPage = 0;
        let scale = 1;
        let isZooming = false;
        let lastDistance = 0;

        const i18n = {
            zh: { back: '← 返回收藏', search: '搜索卡片...', loadMore: '加载更多', noResults: '没有找到匹配的卡片', tags: ['樱木花道','流川枫','三井寿','仙道彰','宫城良田'] },
            en: { back: '← Back', search: 'Search cards...', loadMore: 'Load more', noResults: 'No matching cards', tags: ['Hanamichi','Kaede','Mitsui','Toru','Ryota'] },
            ja: { back: '← 戻る', search: 'カードを検索...', loadMore: 'もっと見る', noResults: '一致するカードがありません', tags: ['桜木花道','流川楓','三井寿','仙道彰','宮城リョータ'] }
        };

        const translations = {
            zh: { 'nav-works':'作品','nav-goods':'收藏','nav-about':'关于','nav-guestbook':'留言','lang-label':'语言','back':'← 返回收藏' },
            en: { 'nav-works':'Works','nav-goods':'Collection','nav-about':'About','nav-guestbook':'Guestbook','lang-label':'Lang','back':'← Back' },
            ja: { 'nav-works':'作品','nav-goods':'コレクション','nav-about':'紹介','nav-guestbook':'掲示板','lang-label':'言語','back':'← 戻る' }
        };

        // --- Tag generation ---
        function generateTags(num) {
            const teams = {
                zh: ['湘北','海南','翔阳','陵南','丰玉','山王','教练','经理','友情','比赛','技术','回忆','经典','特殊','其他'],
                en: ['Shohoku','Ryonan','Shoyo','Ryonan','Toyotama','Sannoh','Coach','Manager','Friendship','Match','Skill','Memory','Classic','Special','Other'],
                ja: ['湘北','海南','翔陽','陵南','豊玉','山王','監督','マネージャー','友情','試合','技術','思い出','名場面','特殊','その他']
            };
            const t = teams[currentLang] || teams.zh;
            const idx = Math.min(Math.floor((num - 1) / 5), t.length - 1);
            return [t[idx]];
        }

        // --- Render ---
        function renderHeader() {
            const t = i18n[currentLang] || i18n.zh;
            document.getElementById('seriesTitle').textContent = config.title;
            const desc = config.description ? config.description[currentLang] : '';
            document.getElementById('seriesDesc').textContent = desc || '';
            document.getElementById('searchInput').placeholder = t.search;
            document.getElementById('noResults').textContent = t.noResults;

            // Filter tags
            const tagsEl = document.getElementById('filterTags');
            tagsEl.innerHTML = t.tags.map(tag =>
                `<button class="filter-tag" onclick="filterByTag('${tag}')">${tag}</button>`
            ).join('');
        }

        function renderCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            currentPage = 0;
            loadMoreCards();
        }

        function loadMoreCards() {
            const grid = document.getElementById('cardGrid');
            const start = currentPage * CARDS_PER_PAGE;
            const end = Math.min(start + CARDS_PER_PAGE, cardNumbers.length);

            for (let i = start; i < end; i++) {
                const num = cardNumbers[i];
                const tags = generateTags(num);
                const tagStr = tags.join(',');

                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.tags = tagStr;
                card.dataset.num = String(num);

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-front">
                            <div class="card-placeholder">${num}</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-placeholder">${num}B</div>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => card.classList.toggle('flipped'));

                // Lazy load images
                const frontImg = `${config.imagePath}${num}_A.jpg`;
                const backImg = `${config.imagePath}${num}_B.jpg`;
                const defaultImg = `${config.imagePath}${config.defaultImage}`;

                const frontEl = card.querySelector('.card-front');
                const backEl = card.querySelector('.card-back');

                frontEl.innerHTML = `<img src="${frontImg}" alt="${num}A" loading="lazy" onerror="this.src='${defaultImg}'"><div class="card-label"><span class="card-num">${num}</span><button class="card-zoom" onclick="openModal(${num},event)">+</button></div>`;
                backEl.innerHTML = `<img src="${backImg}" alt="${num}B" loading="lazy" onerror="this.src='${defaultImg}'"><div class="card-label"><span class="card-num">${num}</span><button class="card-zoom" onclick="openModal(${num},event)">+</button></div>`;

                grid.appendChild(card);
            }

            currentPage++;

            // Update button
            const btn = document.getElementById('loadMoreBtn');
            const t = i18n[currentLang] || i18n.zh;
            const loaded = Math.min(currentPage * CARDS_PER_PAGE, cardNumbers.length);
            if (loaded >= cardNumbers.length) {
                btn.style.display = 'none';
            } else {
                btn.style.display = 'inline-block';
                btn.textContent = `${t.loadMore} (${loaded}/${cardNumbers.length})`;
            }
        }

        // --- Search & Filter ---
        function searchCards() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.card');
            let visible = 0;

            cards.forEach(c => {
                const match = !term || c.dataset.tags.toLowerCase().includes(term) || c.dataset.num.includes(term);
                c.classList.toggle('hidden', !match);
                if (match) visible++;
            });

            document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
        }

        function filterByTag(tag) {
            document.getElementById('searchInput').value = tag;
            searchCards();

            document.querySelectorAll('.filter-tag').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === tag);
            });
        }

        // --- Modal ---
        function openModal(num, event) {
            if (event) event.stopPropagation();

            const overlay = document.getElementById('modalOverlay');
            const card = document.getElementById('modalCard');
            const info = document.getElementById('modalInfo');

            const frontImg = `${config.imagePath}${num}_A.jpg`;
            const backImg = `${config.imagePath}${num}_B.jpg`;
            const defaultImg = `${config.imagePath}${config.defaultImage}`;

            card.innerHTML = `
                <div class="modal-card-inner">
                    <div class="modal-face modal-front">
                        <div class="modal-image-container">
                            <div class="modal-image-wrapper">
                                <img src="${frontImg}" alt="${num}A" onerror="this.src='${defaultImg}'">
                            </div>
                        </div>
                    </div>
                    <div class="modal-face modal-back">
                        <div class="modal-image-container">
                            <div class="modal-image-wrapper">
                                <img src="${backImg}" alt="${num}B" onerror="this.src='${defaultImg}'">
                            </div>
                        </div>
                    </div>
                </div>
            `;

            info.textContent = `No.${num}`;
            scale = 1;

            card.classList.remove('flipped');
            card.onclick = () => card.classList.toggle('flipped');

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            setupZoom();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
            scale = 1;
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

        // --- Zoom ---
        function setupZoom() {
            document.querySelectorAll('.modal-image-container').forEach(container => {
                const wrapper = container.querySelector('.modal-image-wrapper');

                container.addEventListener('wheel', e => {
                    e.preventDefault();
                    scale = Math.min(Math.max(scale * (e.deltaY > 0 ? 0.9 : 1.1), 1), 5);
                    wrapper.style.transform = `scale(${scale})`;
                }, { passive: false });

                container.addEventListener('dblclick', () => {
                    scale = 1;
                    wrapper.style.transform = `scale(1)`;
                });

                let lastDist = 0;
                container.addEventListener('touchstart', e => {
                    if (e.touches.length === 2) {
                        e.preventDefault();
                        lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                    }
                }, { passive: false });

                container.addEventListener('touchmove', e => {
                    if (e.touches.length === 2) {
                        e.preventDefault();
                        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                        scale = Math.min(Math.max(scale * (dist / lastDist), 1), 5);
                        lastDist = dist;
                        wrapper.style.transform = `scale(${scale})`;
                    }
                }, { passive: false });
            });
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            renderHeader();
            renderCards();
        });

        window.addEventListener('langchange', () => {
            renderHeader();
            renderCards();
        });
    </script>
</body>
</html>
