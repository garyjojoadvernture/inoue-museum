<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAMDUNK Card Series</title>
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/navigation.css">
    <style>
        .back-link {
            display: inline-block;
            font-size: 13px;
            color: var(--color-text-light);
            letter-spacing: 1px;
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid transparent;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--color-text);
            border-bottom-color: var(--color-text);
            opacity: 1;
        }

        .series-list {
            list-style: none;
        }

        .series-entry {
            border-bottom: 1px solid var(--color-border-light);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .series-entry:hover {
            opacity: 0.6;
        }

        .series-entry-inner {
            display: flex;
            gap: var(--spacing-md);
            padding: var(--spacing-md) 0;
            align-items: flex-start;
        }

        .series-thumb {
            width: 80px;
            height: 110px;
            flex-shrink: 0;
            overflow: hidden;
            background: var(--color-bg-alt);
        }

        .series-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(40%);
            transition: filter 0.3s;
        }

        .series-entry:hover .series-thumb img {
            filter: grayscale(0%);
        }

        .series-info {
            flex: 1;
            min-width: 0;
        }

        .series-info h3 {
            font-family: var(--font-serif);
            font-size: 17px;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .series-info .meta {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-light);
            margin-bottom: 8px;
        }

        .series-info .desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .series-thumb {
                width: 60px;
                height: 80px;
            }

            .series-info h3 {
                font-size: 15px;
            }

            .series-info .desc {
                -webkit-line-clamp: 2;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="../../../index.html" class="nav-site">井上博物館</a>
            <div class="nav-links">
                <a href="../../../work/inouework.html" data-i18n="nav-works">作品</a>
                <a href="../slamdunkgoods.html" class="active" data-i18n="nav-goods">收藏</a>
                <a href="../../../about.html" data-i18n="nav-about">关于</a>
                <a href="../../../guestbook.html" data-i18n="nav-guestbook">留言</a>
            </div>
            <div class="language-switcher">
                <div class="language-dropdown">
                    <button class="language-btn" onmouseover="showLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <span data-i18n="lang-label">语言</span><span class="arrow">&#9662;</span>
                    </button>
                    <div class="language-list" onmouseover="keepLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <button class="language-option selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
                        <button class="language-option" data-lang="en" onclick="switchLanguage('en')">English</button>
                        <button class="language-option" data-lang="ja" onclick="switchLanguage('ja')">日本語</button>
                    </div>
                </div>
            </div>
            <button class="nav-toggle" onclick="openMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-spacer"></div>

    <!-- Mobile Overlay -->
    <div class="nav-overlay" id="navOverlay">
        <button class="nav-close" onclick="closeMobileMenu()">&times;</button>
        <ul class="nav-overlay-links">
            <li><a href="../../../work/inouework.html" data-i18n="nav-works">作品</a></li>
            <li><a href="../slamdunkgoods.html" data-i18n="nav-goods">收藏</a></li>
            <li><a href="../../../about.html" data-i18n="nav-about">关于</a></li>
            <li><a href="../../../guestbook.html" data-i18n="nav-guestbook">留言</a></li>
        </ul>
        <div class="nav-overlay-lang">
            <button class="selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
            <button data-lang="en" onclick="switchLanguage('en')">EN</button>
            <button data-lang="ja" onclick="switchLanguage('ja')">JP</button>
        </div>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 data-i18n="title">SLAMDUNK 卡片系列</h1>
            <p class="subtitle" data-i18n="subtitle">Card Collection Series</p>
        </div>
    </div>

    <!-- Main -->
    <main class="container section" style="padding-top: 0; max-width: 680px;">
        <a href="../slamdunkgoods.html" class="back-link" data-i18n="back">&larr; 返回收藏</a>
        <ul class="series-list" id="seriesList"></ul>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <p data-i18n="footer">&copy; 2024 Inoue Museum</p>
        </div>
    </footer>

    <script src="../../../js/navigation.js"></script>
    <script>
        const SERIES_DATA = [
            {
                key: '1997CardassMasters',
                titles: { zh: '1997 Cardass Masters系列', en: '1997 Cardass Masters Series', ja: '1997 カードダスマスターズ' },
                descriptions: {
                    zh: '1997年推出的Cardass Masters系列是Bandai发行的经典集换式卡片游戏。共145张卡片，涵盖主要角色及比赛经典场景。',
                    en: 'The 1997 Cardass Masters series by Bandai is a classic collectible card game with 145 cards featuring main characters and iconic match scenes.',
                    ja: '1997年発売のカードダスマスターズシリーズはバンダイの交換式カードゲーム。全145枚、主要キャラクターと試合の名場面を収録。'
                },
                totalCards: 145,
                year: 1997,
                page: 'card-gallery.html',
                series: '1997CardassMasters',
                image: '../../../images/goods/slamdunk/card/cardseries/1997-cardass-masters.png'
            },
            {
                key: '1994CardassSlamDunk',
                titles: { zh: '1994 CARDDASS 激斗卡', en: '1994 CARDDASS Battle Cards', ja: '1994 カードダス激闘カード' },
                descriptions: {
                    zh: '万代于1994-1995年推出的官方卡牌产品，共6弹252张卡片，以TV动画内容为基础。',
                    en: 'Official card product by Bandai (1994-1995), 6 sets with 252 cards based on the TV anime.',
                    ja: '1994-1995年にバンダイが発売した公式カード製品。全6弾252枚、TVアニメベース。'
                },
                totalCards: 252,
                year: 1994,
                page: 'card-gallery.html',
                series: '1994CardassSlamDunk',
                image: '../../../images/goods/slamdunk/card/cardseries/1994carddass.jpg'
            },
            {
                key: 'ppcard',
                titles: { zh: '1993 AMADA PP卡', en: '1993 AMADA PP Cards', ja: '1993 アマダPPカード' },
                descriptions: {
                    zh: 'AMADA于1993-1994年发行，共3弹146张卡片，含30张闪卡、8张银卡、108张普通卡。',
                    en: 'Released by AMADA (1993-1994), 3 sets with 146 cards including 30 foil, 8 silver, and 108 regular.',
                    ja: '1993-1994年にAMADAが発売。3弾146枚、ホイル30枚、シルバー8枚、通常108枚。'
                },
                totalCards: 146,
                year: 1993,
                page: 'card-gallery.html',
                series: 'ppcard',
                image: '../../../images/goods/slamdunk/card/cardseries/1993pp.jpg'
            }
        ];

        const translations = {
            zh: {
                'nav-works':'作品','nav-goods':'收藏','nav-about':'关于','nav-guestbook':'留言','lang-label':'语言',
                'title':'SLAMDUNK 卡片系列','subtitle':'Card Collection Series','back':'← 返回收藏','footer':'© 2024 Inoue Museum'
            },
            en: {
                'nav-works':'Works','nav-goods':'Collection','nav-about':'About','nav-guestbook':'Guestbook','lang-label':'Lang',
                'title':'SLAMDUNK Card Series','subtitle':'Card Collection Series','back':'← Back','footer':'© 2024 Inoue Museum'
            },
            ja: {
                'nav-works':'作品','nav-goods':'コレクション','nav-about':'紹介','nav-guestbook':'掲示板','lang-label':'言語',
                'title':'SLAMDUNK カードシリーズ','subtitle':'Card Collection Series','back':'← 戻る','footer':'© 2024 井上博物館'
            }
        };

        function render() {
            const list = document.getElementById('seriesList');
            list.innerHTML = SERIES_DATA.map(s => `
                <li class="series-entry" onclick="location.href='${s.page}?series=${s.series}'">
                    <div class="series-entry-inner">
                        <div class="series-thumb">
                            <img src="${s.image}" alt="${s.titles[currentLang]}" loading="lazy">
                        </div>
                        <div class="series-info">
                            <h3>${s.titles[currentLang]}</h3>
                            <div class="meta">${s.year} &middot; ${s.totalCards} cards</div>
                            <div class="desc">${s.descriptions[currentLang]}</div>
                        </div>
                    </div>
                </li>
            `).join('');
        }

        window.addEventListener('langchange', render);
        document.addEventListener('DOMContentLoaded', render);
    </script>
</body>
</html>
