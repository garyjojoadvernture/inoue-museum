<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言 - Guestbook · 井上博物馆</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Hiragino Kaku Gothic Pro", "Yu Gothic", YuGothic, "Meiryo", sans-serif;
            background: #fafafa;
            color: #333;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .guestbook-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 36px;
            font-weight: 300;
            letter-spacing: 8px;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            color: #999;
            letter-spacing: 2px;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #ccc;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
            animation: fadeIn 0.5s ease-out;
        }

        .success-message.show {
            display: block;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: block;
        }

        .success-message h2 {
            font-size: 28px;
            font-weight: 400;
            color: #27ae60;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .success-message p {
            color: #666;
            margin-bottom: 30px;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            letter-spacing: 2px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26, 26, 46, 0.3);
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #ccc;
        }

        @media (max-width: 768px) {
            .form-card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>
    <div class="guestbook-container">
        <div class="header">
            <span class="icon">💬</span>
            <h1>留言板</h1>
            <p>有任何想法或建议，欢迎留言告诉我</p>
        </div>

        <div class="form-card" id="formCard">
            <!-- 
                使用说明:
                1. 访问 https://formspree.io/ 注册账号
                2. 创建新表单,获取表单 URL (类似: https://formspree.io/f/xxxxx)
                3. 将下面的 action 替换为你的表单 URL
                4. 将 data-sitekey 替换为你的 site key
            -->
            <form 
                id="contactForm"
                action="https://formspree.io/f/mreqpdjd"
                method="POST"
            >
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="请输入您的姓名" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">邮箱</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="请输入您的邮箱" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="subject">主题</label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject" 
                        placeholder="请输入留言主题" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="message">留言内容</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        placeholder="请输入您的留言内容..." 
                        required
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">发送留言</button>
            </form>
        </div>

        <div class="success-message" id="successMessage">
            <span class="success-icon">✅</span>
            <h2>发送成功</h2>
            <p>感谢您的留言，我会尽快回复您！</p>
            <a href="index.html" class="back-link">返回首页</a>
            <p style="margin-top: 20px; cursor: pointer; color: #ff6b35;" onclick="resetForm()">发送另一条留言</p>
        </div>

        <div class="footer">
            <p>Powered by Formspree</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const formCard = document.getElementById('formCard');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            submitBtn.disabled = true;
            submitBtn.textContent = '发送中...';
        });

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: new FormData(form),
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    formCard.style.display = 'none';
                    successMessage.classList.add('show');
                } else {
                    alert('发送失败，请稍后重试');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '发送留言';
                }
            } catch (error) {
                alert('发送失败，请稍后重试');
                submitBtn.disabled = false;
                submitBtn.textContent = '发送留言';
            }
        });

        function resetForm() {
            form.reset();
            formCard.style.display = 'block';
            successMessage.classList.remove('show');
            submitBtn.disabled = false;
            submitBtn.textContent = '发送留言';
        }
    </script>
</body>
</html>
