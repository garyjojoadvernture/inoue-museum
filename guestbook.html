<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page-title">留言 - Inoue Museum</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navigation.css">
    <style>
        .form-container {
            max-width: 480px;
            margin: 0 auto;
            padding: var(--spacing-xl) 24px;
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-group label {
            display: block;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--color-text-light);
            margin-bottom: 8px;
            font-weight: 300;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 1px solid var(--color-border);
            font-size: 15px;
            font-family: var(--font-sans);
            color: var(--color-text);
            background: transparent;
            outline: none;
            transition: border-color 0.2s;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-bottom-color: var(--color-text);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: var(--color-text-light);
            font-weight: 300;
        }

        .form-group textarea {
            min-height: 120px;
            line-height: 1.8;
        }

        .form-submit {
            margin-top: var(--spacing-lg);
        }

        .form-submit button {
            font-size: 13px;
            letter-spacing: 2px;
            padding: 12px 32px;
            border: 1px solid var(--color-text);
            background: transparent;
            color: var(--color-text);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        .form-submit button:hover {
            background: var(--color-text);
            color: var(--color-bg);
        }

        .form-submit button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .form-success {
            display: none;
            text-align: center;
            padding: var(--spacing-xl) 0;
        }

        .form-success.show {
            display: block;
        }

        .form-success h2 {
            font-family: var(--font-serif);
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: var(--spacing-sm);
        }

        .form-success p {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-lg);
        }

        .form-success a {
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--color-text-light);
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 2px;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: var(--spacing-lg) 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="index.html" class="nav-site" data-i18n="nav-site">井上博物館</a>
            <div class="nav-links">
                <a href="work/inouework.html" data-i18n="nav-works">作品</a>
                <a href="goods/slamdunk/slamdunkgoods.html" data-i18n="nav-goods">收藏</a>
                <a href="about.html" data-i18n="nav-about">关于</a>
                <a href="guestbook.html" class="active" data-i18n="nav-guestbook">留言</a>
            </div>
            <div class="language-switcher">
                <div class="language-dropdown">
                    <button class="language-btn" onmouseover="showLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <span data-i18n="lang-label">语言</span><span class="arrow">&#9662;</span>
                    </button>
                    <div class="language-list" onmouseover="keepLanguageMenu()" onmouseout="hideLanguageMenu()">
                        <button class="language-option selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
                        <button class="language-option" data-lang="en" onclick="switchLanguage('en')">English</button>
                        <button class="language-option" data-lang="ja" onclick="switchLanguage('ja')">日本語</button>
                    </div>
                </div>
            </div>
            <button class="nav-toggle" onclick="openMobileMenu()">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="nav-spacer"></div>

    <!-- Mobile Overlay -->
    <div class="nav-overlay" id="navOverlay">
        <button class="nav-close" onclick="closeMobileMenu()">&times;</button>
        <ul class="nav-overlay-links">
            <li><a href="work/inouework.html" data-i18n="nav-works">作品</a></li>
            <li><a href="goods/slamdunk/slamdunkgoods.html" data-i18n="nav-goods">收藏</a></li>
            <li><a href="about.html" data-i18n="nav-about">关于</a></li>
            <li><a href="guestbook.html" data-i18n="nav-guestbook">留言</a></li>
        </ul>
        <div class="nav-overlay-lang">
            <button class="selected" data-lang="zh" onclick="switchLanguage('zh')">中文</button>
            <button data-lang="en" onclick="switchLanguage('en')">EN</button>
            <button data-lang="ja" onclick="switchLanguage('ja')">JP</button>
        </div>
    </div>

    <!-- Form -->
    <div class="form-container">
        <div class="page-header" style="padding: var(--spacing-lg) 0;">
            <h1 data-i18n="title" style="font-size: 28px;">留言</h1>
            <p class="subtitle" data-i18n="subtitle">Guestbook</p>
        </div>

        <div id="formCard">
            <form id="contactForm" action="https://formspree.io/f/mreqpdjd" method="POST">
                <div class="form-group">
                    <label for="name" data-i18n="label-name">姓名</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="label-email">邮箱</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject" data-i18n="label-subject">主题</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message" data-i18n="label-message">留言</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <div class="form-submit">
                    <button type="submit" id="submitBtn" data-i18n="submit">发送</button>
                </div>
            </form>
        </div>

        <div class="form-success" id="formSuccess">
            <h2 data-i18n="success-title">已发送</h2>
            <p data-i18n="success-desc">感谢您的留言</p>
            <a href="index.html" data-i18n="back-home">返回首页</a>
        </div>
    </div>

    <script src="js/navigation.js"></script>
    <script>
        const translations = {
            zh: {
                'nav-site':'井上博物館','nav-works':'作品','nav-goods':'收藏','nav-about':'关于','nav-guestbook':'留言','lang-label':'语言',
                'title':'留言','subtitle':'Guestbook',
                'label-name':'姓名','label-email':'邮箱','label-subject':'主题','label-message':'留言',
                'submit':'发送','success-title':'已发送','success-desc':'感谢您的留言','back-home':'返回首页',
                'footer':'© 2024 Inoue Museum'
            },
            en: {
                'nav-site':'Inoue Museum','nav-works':'Works','nav-goods':'Collection','nav-about':'About','nav-guestbook':'Guestbook','lang-label':'Lang',
                'title':'Guestbook','subtitle':'Leave a message',
                'label-name':'Name','label-email':'Email','label-subject':'Subject','label-message':'Message',
                'submit':'Send','success-title':'Sent','success-desc':'Thank you for your message','back-home':'Back to home',
                'footer':'© 2024 Inoue Museum'
            },
            ja: {
                'nav-site':'井上博物館','nav-works':'作品','nav-goods':'コレクション','nav-about':'紹介','nav-guestbook':'掲示板','lang-label':'言語',
                'title':'掲示板','subtitle':'メッセージを残す',
                'label-name':'名前','label-email':'メール','label-subject':'件名','label-message':'メッセージ',
                'submit':'送信','success-title':'送信完了','success-desc':'メッセージありがとうございます','back-home':'トップへ',
                'footer':'© 2024 井上博物館'
            }
        };

        // Form submission
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '...';

            try {
                const res = await fetch(this.action, {
                    method: this.method,
                    body: new FormData(this),
                    headers: { 'Accept': 'application/json' }
                });

                if (res.ok) {
                    document.getElementById('formCard').style.display = 'none';
                    document.getElementById('formSuccess').classList.add('show');
                } else {
                    alert('Error. Please try again.');
                    btn.disabled = false;
                    btn.textContent = translations[currentLang]?.submit || 'Send';
                }
            } catch (err) {
                alert('Error. Please try again.');
                btn.disabled = false;
                btn.textContent = translations[currentLang]?.submit || 'Send';
            }
        });
    </script>
</body>
</html>
